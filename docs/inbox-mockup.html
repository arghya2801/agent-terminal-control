<title>ATC inbox mockup</title>
<!--
  Inbox: the sidebar direction picked from the prototypes in SIDEBAR-PROTOTYPES.md.
  Open this file in a browser. The agents are scripted and the clock runs fast.

  What to build, and where each piece already exists:

  1. Open view sorted by who needs you, with time in state, peek line and output graph.
     Built on proto/sidebar-triage: src/lib/triage.ts (triageOrder, stateWord, peekLine),
     src/terminal/manager.ts (Tab.mark, Tab.markSince, outputHistory, screenLines),
     src/sidebar/OpenList.svelte. In the inbox the sort is always on (no toggle).
  2. Section headers over the sorted rows: "Waiting on you" (attention, interrupted, idle),
     "Working", "Shells", each with a count. New. Rows are already in triage order, so a
     header goes wherever the group changes (see inbox() below).
  3. Reply in place. New. A waiting agent row shows up to three lines of its peek and a
     Reply button. Reply opens an input under the row; Enter types the text plus Enter into
     that tab without activating it (sendText(key, text) on proto/sidebar-mission's
     manager.ts). Esc closes the input.
  4. Task box at the top of the Open view: prompt, project ("This tab's project" by
     default) and agent. Enter starts the agent in the background and keeps the current
     tab. proto/sidebar-mission: OpenList.svelte and dispatch() in App.svelte.
  5. Ctrl+click rows to pick them; a bar at the bottom of the list sends one line to every
     picked tab. proto/sidebar-mission: OpenList.svelte, onBroadcast in App.svelte.
  6. Ctrl+Shift+J jumps to the agent that has waited longest (jumpWaiting, triage branch).
     Ctrl+Shift+G shows every tab at once (toggleMosaic, mosaicLayout, mission branch).
     The mockup uses Alt+J and Alt+G because the browser keeps Ctrl+Shift+J.
  7. No tab bar. A pane header replaces TabBar: sidebar toggle, the shown tab's status dot,
     icon and title, then "project, branch, state time", a close button, then the new-tab
     split button, UsageChip and the more menu. These are the start, afterTabs and end
     snippets App.svelte already passes to TabBar on main.

  Open questions for the build: split view needs an entry point without the tab bar
  ("Split beside the current tab" is already in the Open view row menu on main); drag
  reordering goes away with the always-on sort.

  Not part of the design, only the mockup: the scripted agents, the clock, the static usage
  chip and the Notes pad contents.
-->

<script type="module">
import { html, render, useEffect, useLayoutEffect, useReducer, useRef } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';

const MIN = 60_000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const BUCKET = 10_000, BUCKETS = 30;
// Same order as URGENCY in src/lib/triage.ts.
const URGENCY = { attention: 0, interrupted: 1, idle: 2, working: 3, open: 4, exited: 5 };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const trunc = (s, n = 40) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);

const subs = new Set();
const emit = () => subs.forEach((f) => f());
let W = null;

const FILES = {
  'billing-api': ['src/auth/session.ts', 'src/auth/cookies.ts', 'src/routes/login.ts', 'test/auth.test.ts'],
  atc: ['src/usage/UsagePanel.svelte', 'src/lib/ipc.ts', 'internal/usage/export.go', 'e2e/app.test.mjs'],
  infra: ['jobs/nightly.yaml', 'queue/worker.go', 'queue/retry.go'],
  'mobile-app': ['package.json', 'src/screens/Settings.tsx', 'src/theme.ts'],
  'docs-site': ['content/install.md', 'astro.config.mjs'],
};
const WORDS = ['SameSite', 'redirectTo', 'exportCsv', 'retryPolicy', 'useTheme', 'onResize'];
const ANSWERS = [
  () => 'Done. The tests pass and the change is committed on the branch. Should I open a pull request?',
  (f) => `I found two ways to do this. One keeps the old function in ${f}, the other is simpler but changes every caller. Which do you want?`,
  (f) => `Finished. I left a TODO in ${f} where the spec is unclear. Want me to ask about it in the issue?`,
];

// ---------- state ----------
// tabMark() in src/lib/format.ts; `since` is Tab.markSince on the triage branch.
const mark = (t) => (t.exited ? 'exited' : t.attention ? 'attention' : t.activity);
function touch(t) {
  const m = mark(t);
  if (m !== t.m) { t.m = m; t.since = W.now; }
}
function newTabObj(o) {
  const t = {
    key: `t${++W.seq}`, exited: false, attention: false, activity: 'open', provider: null, project: null, branch: 'main',
    cwd: '', lines: [], buckets: Array(BUCKETS).fill(0), bucketAt: W.now - (W.now % BUCKET), workLeft: 0, nextLine: 5000,
    lastOut: W.now, answer: null, ...o,
  };
  t.m = mark(t);
  t.since = W.now;
  return t;
}

const PROJECTS = [
  { key: 'billing-api', name: 'billing-api', path: 'C:\\code\\billing-api' },
  { key: 'atc', name: 'atc', path: 'C:\\code\\atc' },
  { key: 'infra', name: 'infra', path: 'C:\\code\\infra' },
  { key: 'mobile-app', name: 'mobile-app', path: 'C:\\code\\mobile-app' },
  { key: 'docs-site', name: 'docs-site', path: 'C:\\code\\docs-site' },
];

function seed() {
  const now = Date.now();
  W = {
    now, seq: 0, speed: W?.speed ?? 10, paused: false, tabs: [], activeKey: null, toasts: [], toastSeq: 0,
    mosaic: false, picked: new Set(), sidebarOpen: true, view: 'open', query: '', menu: null, focusTerm: false,
    task: '', taskProject: '', taskAgent: 'claude', line: '', replying: null,
    notes: '- billing-api: decide on the Safari test\n- ask about retry backoff in infra\n',
  };
  const T = (o, ago, outAgo = 0) => {
    const t = newTabObj(o);
    t.since = now - ago;
    t.lastOut = now - outAgo;
    if (t.activity === 'working') t.buckets = t.buckets.map(() => rnd(0, 3600));
    return t;
  };
  W.tabs = [
    T({ provider: 'claude', project: 'billing-api', branch: 'fix/safari-redirect', title: 'Fix login redirect loop', cwd: 'C:\\code\\billing-api', activity: 'idle', attention: true, lines: [

// ---------- simulation (mockup only) ----------
// outputHistory() on the triage branch: bytes per 10 s over 5 minutes.
function roll(t) {
  const n = Math.floor((W.now - t.bucketAt) / BUCKET);
  if (n <= 0) return;
  if (n >= BUCKETS) t.buckets.fill(0);
  else { t.buckets.splice(0, n); t.buckets.push(...Array(n).fill(0)); }
  t.bucketAt += n * BUCKET;
}
function toolLines(t) {
  const f = pick(FILES[t.project] ?? FILES.atc);
  const cx = t.provider === 'codex';
  return pick([
    () => [['tool', cx ? `Read ${f}` : `Read(${f})`], ['out', `Read ${rnd(40, 400)} lines`]],
    () => [['tool', cx ? `Edited ${f}` : `Edit(${f})`], ['out', cx ? `+${rnd(1, 30)} -${rnd(0, 9)}` : `Updated with ${rnd(1, 30)} additions and ${rnd(0, 9)} removals`]],
    () => [['tool', cx ? `Searched for ${pick(WORDS)}` : `Grep("${pick(WORDS)}")`], ['out', `Found ${rnd(1, 9)} files`]],
    () => [['tool', cx ? 'Ran npm test' : 'Bash(npm test)'], ['out', `${rnd(40, 260)} passed`]],
  ])();
}
function step(d) {
  W.now += d;
  for (const t of W.tabs) {
    roll(t);
    if (t.activity !== 'working' || t.exited) continue;
    t.buckets[BUCKETS - 1] += Math.round((d / 1000) * rnd(200, 2600));
    t.lastOut = W.now;
    t.workLeft -= d;
    t.nextLine -= d;
    if (t.nextLine <= 0) { t.lines.push(...toolLines(t)); t.nextLine = rnd(10, 30) * 1000; }
    if (t.workLeft <= 0) finish(t);
  }
}
function advance(d) {
  for (let left = d; left > 0; left -= 5000) step(Math.min(left, 5000));
  emit();
}
// The app's flagAttention: working to idle in a background tab.
function finish(t) {
  t.activity = 'idle';
  t.lines.push(['say', t.answer ?? pick(ANSWERS)(pick(FILES[t.project] ?? FILES.atc))]);
  t.answer = null;
  if (t.key !== W.activeKey || W.mosaic) { t.attention = true; notify(t); }
  touch(t);
}

  };
  return html`<form class="dispatch" onSubmit=${submit}>
    <input id="task" value=${W.task} onInput=${(e) => { W.task = e.currentTarget.value; }} placeholder="Give an agent a task, Enter to start" aria-label="Task" spellcheck="false" autocomplete="off" />
    <div class="where">
      <select id="task-project" aria-label="Project" value=${W.taskProject} onChange=${(e) => { W.taskProject = e.currentTarget.value; emit(); }}>
        <option value="">This tab's project</option>${PROJECTS.map((p) => html`<option value=${p.key}>${p.name}</option>`)}
      </select>
      <select id="task-agent" aria-label="Agent" value=${W.taskAgent} onChange=${(e) => { W.taskAgent = e.currentTarget.value; emit(); }}>
        <option value="claude">Claude</option><option value="codex">Codex</option>
      </select>
    </div>
  </form>`;
}
function Broadcast() {
  const ref = useRef();
  const live = [...W.picked].filter((k) => W.tabs.some((t) => t.key === k && !t.exited));
  useEffect(() => { ref.current?.focus(); }, [live.length > 0]);
  if (!live.length) return null;
  const send = (e) => {
    e.preventDefault();
    if (!W.line.trim()) return;
    for (const k of live) sendLine(W.tabs.find((t) => t.key === k), W.line);
    W.line = '';
    emit();
  };
  return html`<form class="broadcast" onSubmit=${send}>
    <input id="broadcast" ref=${ref} value=${W.line} onInput=${(e) => { W.line = e.currentTarget.value; }} placeholder=${`Send to ${live.length} tab${live.length === 1 ? '' : 's'}, Enter to send`} aria-label="Broadcast" spellcheck="false" autocomplete="off" />
    <button type="button" onClick=${() => { W.picked.clear(); emit(); }} aria-label="Clear the picked tabs" title="Clear the picked tabs"><${Icon} n="close" s=${12} /></button>
  </form>`;
}

function Sidebar() {
  const tabs = W.tabs;
  const q = W.query.trim().toLowerCase();
  const rows = triageOrder(q ? tabs.filter((t) => `${t.title} ${projectName(t.project)}`.toLowerCase().includes(q)) : tabs);
  const working = tabs.filter((t) => t.m === 'working').length, waiting = tabs.filter((t) => t.m === 'attention').length;
  const open = W.view === 'open';
  return html`<aside class="side">
    <header class="sh">
      <div class="views" role="tablist">
        ${[['sessions', 'Sessions', 15], ['open', 'Open', tabs.length], ['scratch', 'Scratch', 2]].map(([v, l, n]) => html`<button role="tab" aria-selected=${W.view === v} onClick=${() => { W.view = v; emit(); }}>${l} <span class="n">${n}</span></button>`)}
      </div>
      <button class="ib" onClick=${() => newTab()} title="New tab (Ctrl+Shift+T)" aria-label="New tab"><${Icon} n="plus" s=${14} /></button>
    </header>
    <div class="search"><input id="side-search" type="search" placeholder="Filter open tabs" aria-label="Filter open tabs" spellcheck="false" autocomplete="off" value=${W.query} onInput=${(e) => { W.query = e.currentTarget.value; emit(); }} /></div>
    ${open && html`<${TaskBox} />`}
    <div class="list">
      ${!open ? html`<p class="hint">Sessions and Scratch stay as they are on main. The inbox only changes the Open view.</p>`
        : rows.length === 0 ? html`<p class="hint">${tabs.length ? `Nothing matches "${W.query.trim()}".` : 'No tabs open.'}</p>`
        : inbox(rows)}
      ${open && html`<${Broadcast} />`}
    </div>
    <div class="divider">Notes <em>notes.md</em></div>
    <textarea id="notes" class="notes" aria-label="Notes" spellcheck="false" value=${W.notes} onInput=${(e) => { W.notes = e.currentTarget.value; }}></textarea>
    <footer class="sf">${[`${tabs.length} open`, working && `${working} working`, waiting && `${waiting} need you`].filter(Boolean).join(', ')}</footer>
  </aside>`;
}

// ---------- page ----------
const k = (s) => html`<kbd>${s}</kbd>`;
function App() {
  const [, force] = useReducer((x) => x + 1, 0);
  useEffect(() => { subs.add(force); return () => subs.delete(force); }, []);
  return html`
    <header class="top">
      <div class="brand">ATC inbox mockup<small>The sidebar direction picked from the prototypes. Scripted agents; nothing runs.</small></div>
      <div class="clock">
        <span>Clock</span>
        <div class="seg" role="group" aria-label="Clock speed">
          ${[1, 10, 60].map((s) => html`<button aria-pressed=${W.speed === s && !W.paused} onClick=${() => { W.speed = s; W.paused = false; emit(); }}>${s}×</button>`)}
          <button aria-pressed=${W.paused} onClick=${() => { W.paused = !W.paused; emit(); }}>Pause</button>
        </div>
        <button class="pbtn" onClick=${() => advance(5 * MIN)}>Skip 5 min</button>
        <button class="pbtn" onClick=${() => { seed(); emit(); }}>Reset</button>
      </div>
    </header>
    <main class="stage">
      <div class="winwrap">
        <div class="win">
          <div class="cap">ATC<span class="ctl" aria-hidden="true"><span><${Icon} n="min" s=${12} /></span><span><${Icon} n="max" s=${11} /></span><span><${Icon} n="close" s=${12} /></span></span></div>
          <div class="body">
            ${W.sidebarOpen && html`<${Sidebar} />`}
            <section class="main">
              <${PaneHeader} />
              <${Panes} />
              <${Toasts} />
            </section>
          </div>
        </div>
      </div>
      <section class="guide" aria-label="How to try it">
        <h2>Inbox</h2>
        <p>The Open view sorted by who needs you, with the task box, broadcast and mosaic, and you can answer an agent from the list. The list does the tab bar's job, so there is no tab bar.</p>
        <h3>Try this</h3>
        <ul>
          <li>Click Reply under the billing agent's question, type an answer and press Enter. You stay on the tab you were on, and the agent moves to Working.</li>
          <li>Start a task from the box at the top. It shows up under Working, then moves to Waiting on you when it finishes.</li>
          <li>${k('Ctrl')}+click rows to pick them, then send one line to all of them from the bar at the bottom.</li>
          <li>${k('Alt')}+${k('J')} goes to the agent that has waited longest. ${k('Alt')}+${k('G')} shows every agent at once; click a tile to go to it. In the app these are ${k('Ctrl+Shift+J')} and ${k('Ctrl+Shift+G')}.</li>
          <li>Type in the terminal and press Enter to set an agent working. ${k('Esc')} stops it.</li>
        </ul>
        <p class="fine">The clock runs ${W.speed} times faster than real time so states change while you watch. Implementation notes are in a comment at the top of this file.</p>
      </section>
    </main>
    <${Menu} />`;
}

// ---------- boot ----------
seed();
addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  const chord = (e.ctrlKey && e.shiftKey && !e.altKey) || (e.altKey && !e.ctrlKey && !e.shiftKey);
  if (chord && key === 'j') { e.preventDefault(); if (!e.repeat) jump(); }
  else if (chord && key === 'g') { e.preventDefault(); toggleMosaic(); }
  else if (chord && key === 'b') { e.preventDefault(); W.sidebarOpen = !W.sidebarOpen; emit(); }
  else if (key === 'escape') {
    if (W.menu) { W.menu = null; emit(); }
    else if (W.mosaic) { W.mosaic = false; emit(); }
  }
});
addEventListener('mousedown', (e) => { if (W.menu && !e.target.closest('.menu')) { W.menu = null; emit(); } });

let last = performance.now();
setInterval(() => {
  const t = performance.now();
  if (!W.paused) advance((t - last) * W.speed);
  last = t;
}, 250);

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
