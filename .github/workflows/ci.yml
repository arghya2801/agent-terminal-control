# Tests and lint for every pull request and every push to main.
# Same runner and caches as release.yml, so a green PR means the release job's test gate passes too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
      # main.go embeds dist/, so the frontend must exist before Go compiles.
      - run: npm run build
      - run: npm run test:ts
      - run: go test -race ./...
      - run: npm run lint
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: npm run desktop:build

# End-to-end tests (npm run test:e2e, #97) drive native WebView2 windows with real input,
# which needs an interactive Windows desktop, so they run locally only.
