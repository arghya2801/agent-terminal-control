# Tests and lint for pull requests from develop to main, and every push to main.
# Other branches skip CI. release.yml does not test again: it waits for this workflow
# to pass on the tagged commit, so the push to main must keep running it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name == 'push' || github.head_ref == 'develop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Same Bun as runtime.go pins for agent chats.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: bun install --frozen-lockfile
      # main.go embeds dist/, so the frontend must exist before Go compiles.
      - run: bun run build
      - run: bun run test:ts
      - run: go test -race ./...
      - run: bun run lint
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: bun run desktop:build
      # The committed bindings must match App's methods.
      - run: bun run bindings && git diff --exit-code wailsjs/go

# End-to-end tests (bun run test:e2e, #97) drive native WebView2 windows with real input,
# which needs an interactive Windows desktop, so they run locally only.
