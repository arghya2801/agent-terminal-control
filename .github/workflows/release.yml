# Builds the Windows artefacts for a version tag and attaches them to a draft release,
# then merges the tagged commit into develop.
#
# Push a tag (`git tag v0.4.0 && git push origin v0.4.0`), then edit and publish the draft
# this leaves behind. The binaries are unsigned: no certificate is available, so
# SmartScreen warns on first run.
name: Release

on:
  push:
    tags: ['v*']
  # Lets the build be exercised without publishing anything.
  workflow_dispatch:

permissions:
  contents: write
  # To read whether CI passed on the tagged commit.
  actions: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Same Bun as runtime.go pins for agent chats.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Installer names come from package.json and EXE metadata from wails.json; a tag
      # that disagrees with either would ship mislabelled artefacts.
      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(bun -p "require('./package.json').version")
          exe=$(bun -p "require('./wails.json').info.productVersion")
          [ "$tag" = "$pkg" ] && [ "$tag" = "$exe" ] || { echo "tag $tag, package.json $pkg, wails.json $exe"; exit 1; }

      - run: bun install --frozen-lockfile
      # main.go embeds dist/, so the frontend must exist before Go compiles.
      - run: bun run build

      # Compiling the Wails CLI took about 20 s a release; it only changes with WAILS_VERSION.
      - name: Cache the Wails CLI
        id: wails
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails3.exe
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}
      - if: steps.wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: choco install nsis wixtoolset -y --no-progress
      - run: bun run desktop:package

      # atc.exe is the portable build users expect alongside the installers.
      - uses: actions/upload-artifact@v7
        with:
          name: atc-windows
          path: |
            build/bin/atc.exe
            build/bin/*-setup.exe
            build/bin/*.msi
          if-no-files-found: error

      # Tests and lint run in CI, not again here. A tag is pushed right after its merge, while
      # CI on that commit is often still running, so this waits for it; a failed CI drafts nothing.
      - name: Check CI passed on this commit
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "CI on $GITHUB_SHA ended: $run"; exit 1 ;;
            esac
            sleep 20
          done
          echo "CI on $GITHUB_SHA did not finish in 20 minutes (last: ${run:-no run})"; exit 1

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            build/bin/atc.exe
            build/bin/*-setup.exe
            build/bin/*.msi

  # Brings the version bump back to develop, so the next develop-to-main PR starts even.
  sync-develop:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --ff-only "$GITHUB_SHA" || git merge --no-edit -m "merge: $GITHUB_REF_NAME into develop" "$GITHUB_SHA"
          git push origin develop
