[package]
name = "atc"
version = "0.3.0"
description = "ATC - Agent Terminal Control"
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "atc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

# pty
portable-pty = "0.9.0"

# index / fs
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
dunce = "1"

# plan usage (/usage) request
# platform-verifier: trust the Windows certificate store, so a corporate TLS-inspecting
# proxy whose root is installed there is accepted (webpki's bundled roots reject it).
ureq = { version = "3", features = ["json", "platform-verifier"] }

# Windows notification when a background Claude session finishes or needs input
tauri-plugin-notification = "2"

# save dialog for the Usage page's CSV export
tauri-plugin-dialog = "2"

# WebView2 swallows Chromium's accelerator keys (Ctrl+Shift+B, Ctrl+Tab, Ctrl+R...)
# before they reach the page. Turning that off needs the raw COM interface. Versions are
# pinned to what tauri already resolves so no duplicate crates appear in the tree.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
