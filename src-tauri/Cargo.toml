[package]
name = "atc"
version = "0.1.0"
description = "ATC - Agent Terminal Control"
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "atc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# pty
portable-pty = "0.9.0"

# index / fs
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
dunce = "1"

# WebView2 swallows Chromium's accelerator keys (Ctrl+Shift+B, Ctrl+Tab, Ctrl+R...)
# before they reach the page. Turning that off needs the raw COM interface. Versions are
# pinned to what tauri already resolves so no duplicate crates appear in the tree.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
